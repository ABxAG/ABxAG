<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download ABxAG — All Versions</title>
  <meta name="description" content="Download every ABxAG release for Windows, arranged by version. Setup installer and portable builds." />
  <link rel="icon" type="image/jpeg" href="../ABxAG.jpg" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>
  <header class="nav">
    <a class="brand" href="../">
      <img src="../ABxAG.jpg" alt="ABxAG logo" />
      <span class="brand-name">AB<em>x</em>AG</span>
      <span class="ver-pill"><span class="dot"></span>Download</span>
    </a>
    <nav>
      <a href="../#features">Features</a>
      <a href="../#versions">Versions</a>
      <a href="../roadmap/">Roadmap</a>
      <a href="./">Download</a>
      <a href="https://github.com/ABxAG/ABxAG" target="_blank" rel="noopener">GitHub</a>
      <a class="btn primary small" href="https://github.com/ABxAG/ABxAG/releases/latest" target="_blank" rel="noopener">⬇ Latest</a>
    </nav>
  </header>
  <main>
    <section class="section" style="padding-top:56px">
      <div class="sec-head">
        <h2>Download <span class="grad">ABxAG</span></h2>
        <p>Every release, newest first. Pick any version — the app's updater can switch between them anytime.</p>
      </div>
      <div id="status">Loading releases…</div>
      <div id="list" class="dl-list"></div>
      <div class="center"><a class="back" href="../">← Back to homepage</a></div>
    </section>
  </main>
  <footer>
    <div class="foot-inner">
      <span class="foot-brand"><img src="../ABxAG.jpg" alt="" /><span><b>ABxAG</b> · a private 3D AI desktop companion</span></span>
      <span><a href="../roadmap/">Roadmap</a> ·
      <a href="https://github.com/ABxAG/ABxAG" target="_blank" rel="noopener">GitHub</a> ·
      <a href="https://github.com/ABxAG/ABxAG/releases" target="_blank" rel="noopener">Releases</a></span>
    </div>
  </footer>
  <script src="../feed.js"></script>
  <script>
    (async function () {
      const status = document.getElementById('status');
      const list = document.getElementById('list');
      const F = window.ABxAGFeed;
      try {
        // feed.js normalizes BOTH shapes (bundled mirror + GitHub API),
        // so this page works even where api.github.com is blocked.
        const rels = await F.load('../');
        if (!rels.length) throw new Error('empty');
        list.innerHTML = '';
        rels.forEach((r, i) => {
          const card = document.createElement('div');
          card.className = 'ver-card' + (i === 0 ? ' latest' : '');
          card.innerHTML =
            '<div><h3>ABxAG v' + F.esc(r.version) +
            (i === 0 ? ' <span class="tag latest">latest</span>' : '') +
            (r.prerelease ? ' <span class="tag preview">preview</span>' : '') + '</h3>' +
            '<div class="meta">' + F.esc(F.fmtDate(r.date)) + '</div>' +
            (r.notes ? '<div class="notes">' + F.md(r.notes, 600) + '</div>' : '') + '</div>' +
            '<div class="asset-btns">' +
            (r.setup ? '<a class="btn primary" style="text-align:center" href="' + r.setup.url + '">⬇ Setup · ' + F.mb(r.setup.size) + '</a>' : '') +
            (r.portable ? '<a class="btn ghost" style="text-align:center" href="' + r.portable.url + '">Portable · ' + F.mb(r.portable.size) + '</a>' : '') +
            (!r.setup && !r.portable ? '<span class="muted">No Windows builds attached.</span>' : '') +
            '</div>';
          list.appendChild(card);
        });
        status.remove();
      } catch (e) {
        status.innerHTML = 'Could not load the release list. Get every version on ' +
          '<a href="https://github.com/ABxAG/ABxAG/releases" target="_blank" rel="noopener">GitHub Releases</a>.';
      }
    })();
  </script>
</body>
</html>
